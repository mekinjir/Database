<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID INVICTUS — Dashboard Ortu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg: #06070d;
    --bg2: #0b0f1a;
    --card: rgba(255,255,255,.04);
    --border: rgba(255,255,255,.08);
    --text: #e5e7eb;
    --muted: #94a3b8;
    --primary: #8b5cf6;
    --primary2: #6366f1;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(139,92,246,.18), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(99,102,241,.15), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  a { color: inherit; }

  /* ============ LOGIN ============ */
  #authPage {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .auth-card {
    width: 100%; max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 40px 32px;
    box-shadow: 0 25px 60px rgba(0,0,0,.5);
  }
  .auth-card h1 {
    text-align: center;
    font-size: 24px; letter-spacing: 3px; font-weight: 800;
    background: linear-gradient(135deg, #a78bfa, #6366f1);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  .auth-card .subtitle {
    text-align: center; color: var(--muted); font-size: 13px;
    margin-bottom: 28px;
  }
  .input-field {
    width: 100%;
    padding: 13px 16px;
    margin-bottom: 12px;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    transition: border-color .2s;
  }
  .input-field:focus {
    outline: none;
    border-color: var(--primary);
  }
  .btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary2));
    border: none; border-radius: 12px;
    color: white; font-size: 15px; font-weight: 700;
    letter-spacing: .3px;
    transition: transform .1s, box-shadow .2s;
  }
  .btn-primary:hover { box-shadow: 0 8px 25px rgba(139,92,246,.35); }
  .btn-primary:active { transform: scale(.98); }
  .auth-error {
    color: var(--danger); font-size: 13px;
    text-align: center; margin-top: 14px; min-height: 18px;
  }

  /* ============ MAIN APP ============ */
  #mainApp { display: none; padding: 20px; max-width: 1080px; margin: 0 auto; }

  .hero {
    display: flex; align-items: center; gap: 16px;
    padding: 20px 22px; margin-bottom: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    backdrop-filter: blur(20px);
  }
  .hero-top {
    display: flex; align-items: center; gap: 12px;
  }
  .hero-text { flex: 1; min-width: 0; }
  .hero-text h1 {
    font-size: 17px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #a78bfa, #818cf8);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .hero-text p { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .menu-btn {
    width: 44px; height: 44px; border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.05);
    color: #fff; font-size: 18px; flex-shrink: 0;
    display: grid; place-items: center;
    transition: background .15s;
  }
  .menu-btn:hover { background: rgba(255,255,255,.12); }

  .logout-btn {
    padding: 10px 16px; border-radius: 12px;
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .logout-btn:hover { background: rgba(239,68,68,.2); }

  /* ============ DEVICE GRID ============ */
  .section-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--muted); margin-bottom: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .device-grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .device-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    transition: all .2s;
    cursor: pointer;
    position: relative;
  }
  .device-card:hover {
    border-color: rgba(139,92,246,.5);
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(139,92,246,.15);
  }
  .device-card .dev-head {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px;
  }
  .dev-icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary2));
    display: grid; place-items: center;
    font-size: 18px; color: white;
  }
  .dev-name { font-weight: 700; font-size: 15px; }
  .dev-status {
    font-size: 11px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .dev-status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }
  .dev-actions {
    display: flex; gap: 8px; margin-top: 14px;
  }
  .btn-action {
    padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.04);
    color: var(--text); font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
  }
  .btn-action:hover { background: rgba(255,255,255,.08); }
  .btn-chat { border-color: rgba(139,92,246,.4); color: #c4b5fd; }
  .btn-chat:hover { background: rgba(139,92,246,.15); }
  .btn-cam { border-color: rgba(59,130,246,.4); color: #93c5fd; }
  .btn-cam:hover { background: rgba(59,130,246,.15); }
  .btn-del { border-color: rgba(239,68,68,.3); color: #fca5a5; }
  .btn-del:hover { background: rgba(239,68,68,.15); }
  .btn-unlock { border-color: rgba(16,185,129,.4); color: #6ee7b7; width: 100%; justify-content: center; }
  .btn-unlock:hover { background: rgba(16,185,129,.15); }
  .btn-delete { border-color: rgba(239,68,68,.4); color: #fca5a5; }
  .btn-delete:hover { background: rgba(239,68,68,.15); }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted);
    background: var(--card); border: 1px dashed var(--border);
    border-radius: 16px; font-size: 14px;
  }
  .empty-state i { font-size: 32px; opacity: .4; display: block; margin-bottom: 12px; }

  /* ============ DRAWER ============ */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    z-index: 1099; opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; left: -320px;
    width: 300px; height: 100vh;
    background: #0a0f1a;
    border-right: 1px solid var(--border);
    z-index: 1100; transition: left .25s ease;
    display: flex; flex-direction: column;
  }
  .drawer.show { left: 0; }
  .drawer-head {
    padding: 26px 22px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(139,92,246,.15), transparent);
  }
  .drawer-head .uname {
    font-size: 18px; font-weight: 800;
    letter-spacing: .5px;
  }
  .drawer-head .urole { margin-top: 8px; }
  .drawer-body { padding: 10px; flex: 1; overflow-y: auto; }
  .drawer-link {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px; border-radius: 12px;
    border: none; background: none;
    color: var(--text); font-size: 14px;
    text-align: left; font-weight: 500;
    transition: background .15s;
  }
  .drawer-link:hover { background: rgba(255,255,255,.06); }
  .drawer-link i { width: 20px; text-align: center; color: var(--muted); }
  .drawer-link.danger { color: #fca5a5; }
  .drawer-link.danger i { color: #fca5a5; }
  .drawer-sep { height: 1px; background: var(--border); margin: 10px 14px; }

  /* ============ ROLE BADGES ============ */
  .role-badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 10px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .6px;
  }
  .role-developer { background: rgba(124,58,237,.2); color: #c4b5fd; border: 1px solid rgba(124,58,237,.4); }
  .role-owner     { background: rgba(220,38,38,.2);  color: #fca5a5; border: 1px solid rgba(220,38,38,.4); }
  .role-moderator { background: rgba(234,88,12,.2);  color: #fdba74; border: 1px solid rgba(234,88,12,.4); }
  .role-reseller  { background: rgba(202,138,4,.2);  color: #fde68a; border: 1px solid rgba(202,138,4,.4); }
  .role-fullup    { background: rgba(5,150,105,.2);  color: #6ee7b7; border: 1px solid rgba(5,150,105,.4); }

  /* ============ MODAL ============ */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.75);
    z-index: 1200; display: none;
    align-items: center; justify-content: center;
    padding: 20px; backdrop-filter: blur(4px);
  }
  .modal-bg.show { display: flex; }
  .modal {
    width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto;
    background: #0d1421;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 25px 60px rgba(0,0,0,.6);
  }
  .modal h3 {
    font-size: 16px; font-weight: 800; letter-spacing: .3px;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .close-btn {
    width: 100%; margin-top: 16px;
    padding: 12px; border-radius: 12px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    color: var(--muted); font-size: 13px; font-weight: 600;
  }
  .close-btn:hover { background: rgba(255,255,255,.08); color: var(--text); }

  /* ============ PAIRING CODE ============ */
  .pair-display {
    background: linear-gradient(135deg, rgba(139,92,246,.15), rgba(99,102,241,.1));
    border: 2px dashed rgba(139,92,246,.4);
    border-radius: 16px;
    padding: 32px 20px;
    text-align: center;
    margin-bottom: 14px;
  }
  .pair-code {
    font-family: "Courier New", monospace;
    font-size: 42px; font-weight: 900;
    letter-spacing: 10px;
    background: linear-gradient(135deg, #a78bfa, #818cf8);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .pair-hint {
    text-align: center; font-size: 12px; color: var(--muted);
    line-height: 1.6;
  }

  /* ============ ACCOUNTS TABLE ============ */
  .acc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .acc-table th, .acc-table td {
    text-align: left; padding: 10px 6px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .acc-table th {
    color: var(--muted); font-size: 10px;
    text-transform: uppercase; letter-spacing: .6px;
    font-weight: 700;
  }
  .acc-code {
    font-family: "Courier New", monospace;
    color: #a5b4fc; font-weight: 700; font-size: 12px;
  }

  /* ============ DEVICE DETAIL ============ */
  .dev-detail-head {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 20px;
  }
  .back-btn {
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    color: var(--text); font-size: 16px;
    display: grid; place-items: center;
  }
  .back-btn:hover { background: rgba(255,255,255,.1); }

  .tabs {
    display: flex; gap: 6px; margin-bottom: 18px;
    overflow-x: auto; padding-bottom: 4px;
  }
  .tab {
    padding: 10px 18px; border-radius: 10px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    color: var(--muted); font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap; transition: all .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, rgba(139,92,246,.25), rgba(99,102,241,.2));
    border-color: rgba(139,92,246,.5);
    color: #c4b5fd;
  }
  .tab-pane { animation: fadeIn .2s; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Chat */
  .chat-box {
    height: 380px; overflow-y: auto;
    background: rgba(0,0,0,.3);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }
  .chat-msg { display: flex; margin-bottom: 10px; }
  .chat-msg.ortu { justify-content: flex-end; }
  .chat-bubble {
    max-width: 72%; padding: 10px 14px;
    border-radius: 14px; font-size: 14px;
    word-wrap: break-word; line-height: 1.4;
  }
  .chat-msg.ortu .chat-bubble {
    background: linear-gradient(135deg, var(--primary), var(--primary2));
    color: white; border-bottom-right-radius: 4px;
  }
  .chat-msg.anak .chat-bubble {
    background: rgba(255,255,255,.08);
    color: var(--text); border-bottom-left-radius: 4px;
  }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input {
    flex: 1; padding: 12px 16px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-size: 14px;
  }
  .chat-input-row input:focus { outline: none; border-color: var(--primary); }
  .chat-send-btn {
    padding: 12px 20px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary2));
    border: none; color: white; font-weight: 700; font-size: 14px;
  }

  /* Apps */
  .app-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .app-row:last-child { border-bottom: none; }
  .app-ico {
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(255,255,255,.06);
    display: grid; place-items: center;
    font-size: 16px; flex-shrink: 0;
  }
  .app-info { flex: 1; min-width: 0; }
  .app-label { font-weight: 600; font-size: 13px; }
  .app-pkg { font-size: 11px; color: var(--muted); font-family: monospace; }
  .app-toggle {
    padding: 6px 14px; border-radius: 8px;
    border: none; font-size: 11px; font-weight: 800;
    letter-spacing: .5px; text-transform: uppercase;
  }
  .app-toggle.blocked { background: rgba(239,68,68,.2); color: #fca5a5; border: 1px solid rgba(239,68,68,.4); }
  .app-toggle.allowed { background: rgba(16,185,129,.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }

  /* Camera */
  .cam-img {
    width: 100%; border-radius: 12px;
    display: block;
    border: 1px solid var(--border);
  }
  .cam-empty {
    text-align: center; padding: 60px 20px;
    color: var(--muted); font-size: 13px;
  }

  /* Actions */
  .action-grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
  .action-btn {
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600;
    transition: all .15s;
  }
  .action-btn:hover {
    border-color: rgba(139,92,246,.5);
    background: rgba(139,92,246,.1);
  }
  .action-btn i { font-size: 20px; color: var(--primary); }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1e293b;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 22px; border-radius: 12px;
    font-size: 14px; font-weight: 600;
    z-index: 2000;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    transition: transform .3s ease, opacity .3s;
    opacity: 0;
    max-width: 90vw;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast.success { border-color: rgba(16,185,129,.5); color: #6ee7b7; }
  .toast.error { border-color: rgba(239,68,68,.5); color: #fca5a5; }

  @media (max-width: 600px) {
    #mainApp { padding: 14px; }
    .hero { padding: 16px; border-radius: 14px; }
    .hero-text h1 { font-size: 15px; letter-spacing: 1.5px; }
    .logout-btn span { display: none; }
    .pair-code { font-size: 32px; letter-spacing: 6px; }
    .modal { padding: 20px; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN PAGE ============ -->
<div id="authPage">
  <div class="auth-card">
    <h1>VOID INVICTUS</h1>
    <p class="subtitle">Parental Control Dashboard</p>
    <input type="text" id="loginUsername" class="input-field" placeholder="Username" autocomplete="username">
    <input type="password" id="loginPassword" class="input-field" placeholder="Password" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">Masuk</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="mainApp">
  <div class="hero">
    <div class="hero-text">
      <div class="hero-top">
        <button class="menu-btn" onclick="openDrawer()"><i class="fa-solid fa-bars"></i></button>
        <h1>VOID INVICTUS</h1>
      </div>
      <p id="userGreeting">Selamat datang kembali.</p>
    </div>
    <button class="logout-btn" onclick="logout()">
      <i class="fa-solid fa-power-off"></i><span>Keluar</span>
    </button>
  </div>

  <div id="dashboardView">
    <div class="section-title"><i class="fa-solid fa-mobile-screen"></i> Daftar HP Anak</div>
    <div id="deviceGrid" class="device-grid"></div>
  </div>

  <div id="detailView" style="display:none;"></div>
</div>

<!-- ============ DRAWER ============ -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="uname" id="drawerUser">-</div>
    <div class="urole" id="drawerRole"></div>
  </div>
  <div class="drawer-body">
    <button class="drawer-link" onclick="closeDrawer();showDashboard()">
      <i class="fa-solid fa-house"></i> Dashboard
    </button>
    <button class="drawer-link" onclick="closeDrawer();openPairing()">
      <i class="fa-solid fa-satellite-dish"></i> Kode Pairing
    </button>
    <div class="drawer-sep"></div>
    <button class="drawer-link" id="menuCreate" onclick="closeDrawer();openAccounts('create')">
      <i class="fa-solid fa-user-plus"></i> Buat Akun
    </button>
    <button class="drawer-link" id="menuAccounts" onclick="closeDrawer();openAccounts('list')">
      <i class="fa-solid fa-users"></i> Daftar Akun
    </button>
    <div class="drawer-sep"></div>
    <button class="drawer-link danger" onclick="logout()">
      <i class="fa-solid fa-power-off"></i> Logout
    </button>
  </div>
</div>

<!-- ============ PAIRING MODAL ============ -->
<div class="modal-bg" id="pairingModal">
  <div class="modal">
    <h3><i class="fa-solid fa-satellite-dish" style="color:var(--primary);"></i> Kode Pairing</h3>
    <div class="pair-display">
      <div class="pair-code" id="pairingCode">------</div>
    </div>
    <p class="pair-hint">
      Masukkan kode ini di aplikasi HP anak untuk pairing.<br>
      Kode berlaku permanen. Jangan bagikan ke orang lain.
    </p>
    <button class="close-btn" onclick="document.getElementById('pairingModal').classList.remove('show')">Tutup</button>
  </div>
</div>

<!-- ============ ACCOUNT MODAL ============ -->
<div class="modal-bg" id="accountModal">
  <div class="modal">
    <h3><i class="fa-solid fa-users-gear" style="color:var(--primary);"></i> Manajemen Akun</h3>

    <div style="display:flex; gap:8px; margin-bottom:18px;">
      <button class="btn-action" style="flex:1; justify-content:center;" id="tabCreateBtn" onclick="switchAccTab('create')">
        <i class="fa-solid fa-plus"></i> Buat
      </button>
      <button class="btn-action" style="flex:1; justify-content:center;" id="tabListBtn" onclick="switchAccTab('list')">
        <i class="fa-solid fa-list"></i> Daftar
      </button>
    </div>

    <div id="accCreatePane">
      <input type="text" id="accUser" class="input-field" placeholder="Username">
      <input type="password" id="accPass" class="input-field" placeholder="Password">
      <select id="accRole" class="input-field"></select>
      <button class="btn-action btn-unlock" style="padding:14px;" onclick="createUser()">
        <i class="fa-solid fa-user-plus"></i> Buat Akun Baru
      </button>
    </div>

    <div id="accListPane" style="display:none;">
      <div id="accList" style="max-height:380px; overflow:auto;">Memuat...</div>
    </div>

    <button class="close-btn" onclick="document.getElementById('accountModal').classList.remove('show')">Tutup</button>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast"></div>

<script>
// ============================================
const CFG = {
  url: 'https://server.mekinjirserver.dpdns.org',
  childKey: '3f7e9a1c5d8b2f4e6a0c9d3b7f1e5a8c2d6f0b4e9a3c7d1f5e8b2a6c0d4f7e1a'
};

const ROLE_LEVEL = { developer: 100, owner: 80, moderator: 60, reseller: 40, fullup: 20 };
let token = localStorage.getItem('token');
let me = null;
let currentDeviceId = null;
let chatInterval = null;

function roleLevel(r) { return ROLE_LEVEL[r] || 0; }
function roleBadge(r) { return `<span class="role-badge role-${r}">${r}</span>`; }

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function formatTime(iso) {
  if (!iso) return '-';
  try {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'baru saja';
    if (diff < 3600) return Math.floor(diff/60) + ' menit lalu';
    if (diff < 86400) return Math.floor(diff/3600) + ' jam lalu';
    return Math.floor(diff/86400) + ' hari lalu';
  } catch { return iso; }
}

// ============================================
// HTTP
async function apiFetch(endpoint, method = 'GET', body = null) {
  const headers = { 'content-type': 'application/json' };
  if (token) headers['authorization'] = 'Bearer ' + token;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);

  const res = await fetch(CFG.url + endpoint, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

// ============================================
// TOAST
let toastTimer = null;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ============================================
// LOGIN
async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';

  if (!username || !password) {
    errEl.textContent = 'Username & password wajib diisi';
    return;
  }

  try {
    const data = await apiFetch('/api/auth/login', 'POST', { username, password });
    token = data.token;
    localStorage.setItem('token', token);
    localStorage.setItem('role', data.role);
    localStorage.setItem('username', data.username);
    await checkAuth();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

document.getElementById('loginUsername').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginPassword').focus();
});
document.getElementById('loginPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// ============================================
// AUTH CHECK
async function checkAuth() {
  if (!token) {
    document.getElementById('authPage').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
    return;
  }
  try {
    me = await apiFetch('/api/auth/me');
  } catch (e) {
    logout();
    return;
  }

  document.getElementById('authPage').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('userGreeting').textContent = 'Halo, ' + me.username;
  document.getElementById('drawerUser').textContent = me.username;
  document.getElementById('drawerRole').innerHTML = roleBadge(me.role);

  const canCreate = (me.can_create_roles || []).length > 0;
  document.getElementById('menuCreate').style.display = canCreate ? 'flex' : 'none';
  document.getElementById('menuAccounts').style.display = me.level > 20 ? 'flex' : 'none';

  showDashboard();
}

function logout() {
  token = null; me = null;
  localStorage.removeItem('token');
  localStorage.removeItem('role');
  localStorage.removeItem('username');
  stopChatPoll();
  document.getElementById('authPage').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
  closeDrawer();
}

// ============================================
// DRAWER
function openDrawer() {
  document.getElementById('drawer').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// ============================================
// DASHBOARD
async function showDashboard() {
  stopChatPoll();
  document.getElementById('dashboardView').style.display = '';
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('detailView').innerHTML = '';
  currentDeviceId = null;

  const grid = document.getElementById('deviceGrid');
  grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-spinner fa-spin"></i>Memuat device...</div>';

  try {
    const devices = await apiFetch('/api/dashboard/devices');
    if (!devices.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <i class="fa-solid fa-mobile-screen"></i>
        Belum ada HP anak yang pairing.<br>
        Buka menu <b>☰ → Kode Pairing</b> untuk pairing.
      </div>`;
      return;
    }
    grid.innerHTML = devices.map(d => `
      <div class="device-card" onclick="openDevice('${escapeHtml(d.id)}')">
        <div class="dev-head">
          <div class="dev-icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
          <div style="flex:1; min-width:0;">
            <div class="dev-name">${escapeHtml(d.name || 'HP Anak')}</div>
            <div class="dev-status"><span class="dot"></span>${formatTime(d.last_seen)}</div>
          </div>
        </div>
        <div class="dev-actions">
          <button class="btn-action btn-chat" onclick="event.stopPropagation();openDevice('${escapeHtml(d.id)}','chat')">
            <i class="fa-solid fa-comment"></i> Chat
          </button>
          <button class="btn-action btn-cam" onclick="event.stopPropagation();openDevice('${escapeHtml(d.id)}','camera')">
            <i class="fa-solid fa-camera"></i> Kamera
          </button>
          <button class="btn-action btn-del" onclick="event.stopPropagation();deleteDevice('${escapeHtml(d.id)}')">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Gagal memuat: ${escapeHtml(e.message)}</div>`;
  }
}

async function deleteDevice(id) {
  if (!confirm('Hapus HP ini dari dashboard?')) return;
  try {
    await apiFetch('/api/dashboard/device/' + encodeURIComponent(id), 'DELETE');
    showToast('Device dihapus', 'success');
    showDashboard();
  } catch (e) {
    showToast('Gagal: ' + e.message, 'error');
  }
}

// ============================================
// PAIRING
async function openPairing() {
  document.getElementById('pairingModal').classList.add('show');
  document.getElementById('pairingCode').textContent = '......';
  try {
    const data = await apiFetch('/api/dashboard/pair-code', 'POST');
    document.getElementById('pairingCode').textContent = data.code;
  } catch (e) {
    document.getElementById('pairingCode').textContent = 'ERROR';
    showToast('Gagal ambil kode: ' + e.message, 'error');
  }
}

// ============================================
// ACCOUNTS
function openAccounts(tab) {
  if (tab === 'create' && (!me.can_create_roles || !me.can_create_roles.length)) {
    return showToast('Role kamu gak bisa bikin akun', 'error');
  }
  if (tab === 'list' && me.level <= 20) {
    return showToast('Akses ditolak', 'error');
  }
  if (!me.can_create_roles.length) {
    document.getElementById('tabCreateBtn').style.display = 'none';
  } else {
    document.getElementById('tabCreateBtn').style.display = 'flex';
    document.getElementById('accRole').innerHTML = me.can_create_roles
      .map(r => `<option value="${r}">${r}</option>`).join('');
  }
  document.getElementById('accountModal').classList.add('show');
  switchAccTab(tab);
}

function switchAccTab(tab) {
  const isCreate = tab === 'create';
  document.getElementById('accCreatePane').style.display = isCreate ? 'block' : 'none';
  document.getElementById('accListPane').style.display = isCreate ? 'none' : 'block';
  document.getElementById('tabCreateBtn').classList.toggle('btn-chat', isCreate);
  document.getElementById('tabListBtn').classList.toggle('btn-chat', !isCreate);
  if (!isCreate) loadUsers();
}

async function loadUsers() {
  const box = document.getElementById('accList');
  box.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px;">Memuat...</p>';
  try {
    const users = await apiFetch('/api/users');
    if (!users.length) {
      box.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px;">Belum ada akun</p>';
      return;
    }
    box.innerHTML = `<table class="acc-table">
      <thead><tr><th>Username</th><th>Role</th><th>Kode</th><th></th></tr></thead>
      <tbody>
        ${users.map(u => `<tr>
          <td><b>${escapeHtml(u.username)}</b></td>
          <td>${roleBadge(u.role)}</td>
          <td class="acc-code">${escapeHtml(u.pair_code || '-')}</td>
          <td>${u.id !== me.id && me.level > roleLevel(u.role)
            ? `<button class="btn-action btn-delete" style="padding:4px 10px;font-size:11px;"
                onclick="deleteUser(${u.id})"><i class="fa-solid fa-trash"></i></button>`
            : ''}</td>
        </tr>`).join('')}
      </tbody></table>`;
  } catch (e) {
    box.innerHTML = `<p style="color:var(--danger);padding:20px;">${escapeHtml(e.message)}</p>`;
  }
}

async function createUser() {
  const username = document.getElementById('accUser').value.trim();
  const password = document.getElementById('accPass').value;
  const role = document.getElementById('accRole').value;

  if (!username || !password) return showToast('Isi username & password', 'error');

  try {
    const res = await apiFetch('/api/users/create', 'POST', { username, password, role });
    showToast('Akun dibuat! Kode: ' + res.pair_code, 'success');
    document.getElementById('accUser').value = '';
    document.getElementById('accPass').value = '';
    if (document.getElementById('accListPane').style.display !== 'none') loadUsers();
  } catch (e) {
    showToast('Gagal: ' + e.message, 'error');
  }
}

async function deleteUser(id) {
  if (!confirm('Hapus akun ini? Device miliknya juga akan terhapus.')) return;
  try {
    await apiFetch('/api/users/' + id, 'DELETE');
    showToast('Akun dihapus', 'success');
    loadUsers();
  } catch (e) {
    showToast('Gagal: ' + e.message, 'error');
  }
}

// ============================================
// DEVICE DETAIL
function openDevice(id, tab = 'apps') {
  currentDeviceId = id;
  document.getElementById('dashboardView').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';

  const el = document.getElementById('detailView');
  el.innerHTML = `
    <div class="dev-detail-head">
      <button class="back-btn" onclick="showDashboard()"><i class="fa-solid fa-arrow-left"></i></button>
      <div>
        <div style="font-size:16px; font-weight:800;">📱 ${escapeHtml(id)}</div>
        <div style="font-size:12px; color:var(--muted);">Detail device</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab" data-tab="apps" onclick="switchTab('apps')"><i class="fa-solid fa-cubes"></i> Aplikasi</button>
      <button class="tab" data-tab="chat" onclick="switchTab('chat')"><i class="fa-solid fa-comment"></i> Chat</button>
      <button class="tab" data-tab="camera" onclick="switchTab('camera')"><i class="fa-solid fa-camera"></i> Kamera</button>
      <button class="tab" data-tab="action" onclick="switchTab('action')"><i class="fa-solid fa-bolt"></i> Aksi</button>
    </div>
    <div id="tabContent" class="tab-pane"></div>
  `;

  switchTab(tab);
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  stopChatPoll();
  const box = document.getElementById('tabContent');
  if (tab === 'apps') renderAppsTab(box);
  else if (tab === 'chat') renderChatTab(box);
  else if (tab === 'camera') renderCameraTab(box);
  else if (tab === 'action') renderActionTab(box);
}

// === APPS ===
async function renderAppsTab(box) {
  box.innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i>Memuat aplikasi...</div>';
  try {
    const data = await apiFetch('/api/dashboard/apps/' + encodeURIComponent(currentDeviceId));
    const installed = data.installed || [];
    const blocked = new Set(data.blocked || []);
    if (!installed.length) {
      box.innerHTML = '<div class="empty-state"><i class="fa-solid fa-cubes"></i>Belum ada data aplikasi. HP anak harus online.</div>';
      return;
    }
    box.innerHTML = `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 16px;">
      ${installed.map(a => {
        const pkg = typeof a === 'string' ? a : (a.package || a.packageName || a.id || '');
        const label = typeof a === 'string' ? a : (a.label || a.name || pkg);
        const isBlocked = blocked.has(pkg);
        return `<div class="app-row">
          <div class="app-ico"><i class="fa-solid fa-cube"></i></div>
          <div class="app-info">
            <div class="app-label">${escapeHtml(label)}</div>
            <div class="app-pkg">${escapeHtml(pkg)}</div>
          </div>
          <button class="app-toggle ${isBlocked ? 'blocked' : 'allowed'}"
            onclick="toggleBlock('${escapeHtml(pkg)}', ${isBlocked ? 'true' : 'false'})">
            ${isBlocked ? 'BLOKIR' : 'AKTIF'}
          </button>
        </div>`;
      }).join('')}
    </div>`;
  } catch (e) {
    box.innerHTML = `<div class="empty-state">Gagal: ${escapeHtml(e.message)}</div>`;
  }
}

async function toggleBlock(pkg, isBlocked) {
  try {
    const data = await apiFetch('/api/dashboard/apps/' + encodeURIComponent(currentDeviceId));
    const blocked = new Set(data.blocked || []);
    if (isBlocked) blocked.delete(pkg); else blocked.add(pkg);

    await apiFetch('/api/dashboard/blocked', 'POST', {
      device_id: currentDeviceId,
      blocked: [...blocked]
    });
    showToast(isBlocked ? 'Aplikasi dibuka' : 'Aplikasi diblokir', 'success');
    renderAppsTab(document.getElementById('tabContent'));
  } catch (e) {
    showToast('Gagal: ' + e.message, 'error');
  }
}

// === CHAT ===
function renderChatTab(box) {
  box.innerHTML = `
    <div class="chat-box" id="chatBox"><div class="empty-state" style="padding:20px;"><i class="fa-solid fa-spinner fa-spin"></i></div></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Ketik pesan..." maxlength="500">
      <button class="chat-send-btn" onclick="sendChat()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>`;
  document.getElementById('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendChat();
  });
  loadChat();
  startChatPoll();
}

async function loadChat() {
  const chatBox = document.getElementById('chatBox');
  if (!chatBox) return;
  try {
    const msgs = await apiFetch('/api/dashboard/chat/' + encodeURIComponent(currentDeviceId));
    if (!msgs.length) {
      chatBox.innerHTML = '<div class="empty-state" style="padding:20px;">Belum ada chat</div>';
      return;
    }
    chatBox.innerHTML = msgs.map(m => {
      let p = {};
      try { p = JSON.parse(m.payload); } catch (_) {}
      const side = p.sender === 'ortu' ? 'ortu' : 'anak';
      return `<div class="chat-msg ${side}"><div class="chat-bubble">${escapeHtml(p.text || '')}</div></div>`;
    }).join('');
    chatBox.scrollTop = chatBox.scrollHeight;
  } catch (e) {
    chatBox.innerHTML = `<div class="empty-state" style="padding:20px;">Gagal: ${escapeHtml(e.message)}</div>`;
  }
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    await apiFetch('/api/dashboard/chat', 'POST', { device_id: currentDeviceId, text });
    loadChat();
  } catch (e) {
    showToast('Gagal kirim: ' + e.message, 'error');
  }
}

function startChatPoll() {
  stopChatPoll();
  chatInterval = setInterval(loadChat, 4000);
}
function stopChatPoll() {
  if (chatInterval) { clearInterval(chatInterval); chatInterval = null; }
}

// === CAMERA ===
async function renderCameraTab(box) {
  box.innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i>Memuat kamera...</div>';
  try {
    const data = await apiFetch('/api/dashboard/image/' + encodeURIComponent(currentDeviceId));
    if (!data.image) {
      box.innerHTML = '<div class="empty-state"><i class="fa-solid fa-camera"></i>Belum ada gambar. HP anak harus online.</div>';
      return;
    }
    const src = data.image.startsWith('data:') ? data.image : 'data:image/jpeg;base64,' + data.image;
    box.innerHTML = `
      <button class="btn-action btn-cam" style="width:100%; justify-content:center; margin-bottom:12px; padding:12px;"
        onclick="switchTab('camera')"><i class="fa-solid fa-rotate"></i> Refresh</button>
      <img class="cam-img" src="${src}" alt="Kamera">`;
  } catch (e) {
    box.innerHTML = `<div class="empty-state">Gagal: ${escapeHtml(e.message)}</div>`;
  }
}

// === ACTIONS ===
function renderActionTab(box) {
  const actions = [
    { cmd: 'SCREENSHOT', icon: 'fa-image', label: 'Screenshot' },
    { cmd: 'TAKE_PHOTO', icon: 'fa-camera', label: 'Ambil Foto' },
    { cmd: 'LOCK', icon: 'fa-lock', label: 'Kunci Layar' },
    { cmd: 'REBOOT', icon: 'fa-power-off', label: 'Reboot HP' },
  ];
  box.innerHTML = `<div class="action-grid">
    ${actions.map(a => `<button class="action-btn" onclick="sendCommand('${a.cmd}')">
      <i class="fa-solid ${a.icon}"></i> ${a.label}
    </button>`).join('')}
  </div>`;
}

async function sendCommand(type) {
  try {
    await apiFetch('/api/dashboard/command', 'POST', {
      device_id: currentDeviceId, type, payload: {}
    });
    showToast('Perintah ' + type + ' dikirim', 'success');
  } catch (e) {
    showToast('Gagal: ' + e.message, 'error');
  }
}

// ============================================
// START
checkAuth();
</script>
</body>
</html>
